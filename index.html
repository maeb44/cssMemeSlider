<!DOCTYPE html>
<html lang="en">
	<link rel="stylesheet" href="./style.css">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<section class="meme-div">
		<div class="meme-slider">
			<img class="meme-img" src="./img/1.jpg" alt="ОКАК">
			<img class="meme-img" src="./img/2.jpg" alt="буууу">
			<img class="meme-img" src="./img/3.png" alt="ОКАК">
			<img class="meme-img" src="./img/4.jpg" alt="буууу">
		</div>
		<div class="meme-text-div">
			<span class="meme-txt" id="txt1">Вот оно как!</span>
			<span class="meme-txt" id="txt2" hidden>БУ! Испугался?</span>
			<span class="meme-txt" id="txt3" hidden>Да я такой! Чилловый!</span>
			<span class="meme-txt" id="txt4" hidden>ЭЙ ТЫ! Это тебе! Цмок!</span>

		</div>
		<div class="meme-switch">
			<input type="radio" id ='mem1' class="meme-btn" name="mem" checked></input>
			<input type="radio" id ='mem2' class="meme-btn" name="mem"></button>
			<input type="radio" id ='mem3' class="meme-btn" name="mem"></button>
			<input type="radio" id ='mem4' class="meme-btn" name="mem"></button>
		</div>
	</section>
	
</body>
</html>
